<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Member</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Update Member</h1>

        <form action="/update/{{ member._id }}" method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ member.name }}"
                required
            >


            <label>Age</label>

            <input
                type="number"
                name="age"
                value="{{ member.age }}"
                required
            >


            <label>Sport</label>

            <input
                type="text"
                name="sport"
                value="{{ member.sport }}"
                required
            >


            <label>Membership Type</label>

            <select name="membership" required>

                <option value="">Select Membership</option>

                <option value="Gold"
                    {% if member.membership == "Gold" %}selected{% endif %}>
                    🥇 Gold
                </option>

                <option value="Silver"
                    {% if member.membership == "Silver" %}selected{% endif %}>
                    🥈 Silver
                </option>

                <option value="Bronze"
                    {% if member.membership == "Bronze" %}selected{% endif %}>
                    🥉 Bronze
                </option>

            </select>


            <button type="submit">
                💾 Update Member
            </button>

            <a href="/" style="text-decoration: none;">
                <button type="button">
                    ↩️ Back
                </button>
            </a>

        </form>

    </div>

</div>

</body>

</html>
